*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;

        return S.importKey('raw', raw.slice(0, 32), { name: 'AES-CBC' }, false, ['decrypt'])
          .then(function (ek) { return S.decrypt({ name: 'AES-CBC', iv: iv }, ek, ct); })
          .then(function (pt) {
            var html = new TextDecoder().decode(pt);
            document.open(); document.write(html); document.close();
            return true;
          });
      });
  }
  function derive(pass) {
    return S.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveBits'])
      .then(function (base) { return S.deriveBits({ name: 'PBKDF2', salt: b64(D.s), iterations: D.n, hash: 'SHA-256' }, base, 512); })
      .then(function (bits) { return new Uint8Array(bits); });
  }
  function showForm() { form.hidden = false; }

  if (!S) { showForm(); btn.disabled = true; say('This browser can’t unlock the trip. Open the link in Safari or Chrome (it must start with https://).', true); return; }

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var pass = input.value.toLowerCase().replace(/[^a-z0-9]/g, '');
    if (!pass) return;
    btn.disabled = true; say('Unlocking…');
    derive(pass).then(function (raw) {
      return unlock(raw).then(function (ok) {
        if (ok) { store(KEY, toB64(raw)); return; }
        btn.disabled = false; say('That passcode didn’t work — check it in the WhatsApp group.', true); input.select();
      });
    }).catch(function () { btn.disabled = false; say('Something went wrong — try again.', true); });
  });

  var saved = read(KEY);
  if (!saved) { showForm(); return; }
  /* wait for the parser to finish: document.open() during parsing doesn't replace the page, the app would be appended to it */
  function auto() {
    unlock(b64(saved)).then(function (ok) { if (!ok) { store(KEY, null); showForm(); } })
      .catch(function () { store(KEY, null); showForm(); });
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', auto); else auto();
})();
</script>
</body>
</html>
